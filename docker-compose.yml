version: '3.9'
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${IMAGE_ADDRESS}:${IMAGE_TAG:-latest}
    env_file: .env
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: [CMD, curl, -f, 'http://0.0.0.0:3000/api']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  db:
    image: postgres:15
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./data/db_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD, pg_isready, -U, '${POSTGRES_USER}']
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - '5432:5432'

  caddy:
    image: caddy:2
    restart: unless-stopped
    env_file: .env
    ports:
      - 80:80
      - 443:443
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - ./data/caddy_data:/data
      - ./data/caddy_config:/config
    depends_on:
      - app
